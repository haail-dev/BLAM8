<div data-backlog-status="{{ backlog_status.state }}"
     data-poll-url="/onboarding/mailbox/import-status{{ '?surface=settings' if backlog_settings else '' }}"
     class="mt-3 rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-600"
     role="status" aria-live="polite">
  <p{% if backlog_status.state == 'running' %} data-backlog-started{% endif %}{% if backlog_status.ready is defined %} data-backlog-count="{{ backlog_status.ready }}"{% endif %}>{{ backlog_status.message }}</p>
  {% for detail in backlog_status.details or [] %}<p class="mt-1">{{ detail }}</p>{% endfor %}
  {% if backlog_status.retry %}
  <form method="post" action="{{ '/app/settings/mailbox/backlog' if backlog_settings else '/onboarding/mailbox/backlog' }}" class="mt-2">
    <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
    <button class="text-xs font-semibold text-brand hover:underline" data-backlog-retry>{{ 'Import recent messages' if backlog_status.state == 'not_started' else 'Try importing again' }}</button>
  </form>
  {% endif %}
  <p data-backlog-refresh-error class="hidden mt-2">Import status could not be refreshed. Reload this page to check progress.</p>
</div>
