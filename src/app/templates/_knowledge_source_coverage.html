{# Internal decision contract for the Assistant guide. Source inventory is not
   an owner-facing review. No hidden field makes a decision automatically. #}
<input type="hidden" name="source_default" value="{{ review.form.get('source_default','') }}">
{% for u in review.source_view.units if u.kind!='qualification' %}
<input type="hidden" name="source_{{ u.id }}" value="{{ review.form.get('source_'+u.id,'') }}">
<input type="hidden" name="source_reason_{{ u.id }}" value="{{ review.form.get('source_reason_'+u.id,'') }}">
{% endfor %}
