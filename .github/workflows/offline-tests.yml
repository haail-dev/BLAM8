name: Platform tests and agnostic guard
# One run per PR push (pull_request) plus one when a merge lands on main (push).
# Pushing a branch with an open PR used to trigger both: the same suite twice.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only replace obsolete PR checks; let each main run finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  offline:
    name: Platform tests and agnostic guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml
      - run: python -m pip install -r requirements-dev.txt
      - name: Product evidence, content and affected-surface coverage
        run: python scripts/ci/check_product_change.py --base "${{ github.event.pull_request.base.sha || github.event.before }}"
      - name: Always run the agnostic guard
        run: python tests/run_offline.py tests/test_agnostic_context.py tests/test_agnostic_surfaces.py tests/test_agnostic_outcomes.py tests/test_agnostic_inventory.py -q --tb=short --basetemp=.cache/pytest-guard
      - name: Install and expose disposable PostgreSQL binaries
        run: |
          # ubuntu-latest ships PostgreSQL; use its binaries (installing
          # postgresql-server-dev-all clashes with the runner's PGDG packages).
          pg_bin="$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V | tail -1)"
          if [ -z "$pg_bin" ]; then
            sudo apt-get update && sudo apt-get install -y postgresql
            pg_bin="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)"
          fi
          echo "PostgreSQL binaries: $pg_bin"
          test -x "$pg_bin/initdb"
          test -x "$pg_bin/postgres"
          echo "$pg_bin" >> "$GITHUB_PATH"
          echo "OUTREACH_TEST_POSTGRES_BIN=$pg_bin" >> "$GITHUB_ENV"
      - name: Database tests must execute without skips
        run: |
          python tests/run_offline.py tests/test_knowledge_source_database.py tests/test_knowledge_review_database.py tests/test_booking_capacity_database.py tests/test_offer_deadlines_database.py tests/test_booking_guarantees_rollback.py tests/test_no_defaults_rollback.py tests/test_offer_merge.py tests/test_concierge_live_allowance_database.py tests/test_telephone_database.py tests/test_telephone_inbound_database.py tests/test_telephone_objectives_database.py tests/test_telephone_human_handover_database.py -q -rs --tb=short --basetemp=.cache/pytest-db --junitxml=.cache/database-tests.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          report = ET.parse(".cache/database-tests.xml")
          assert report.findall(".//testcase"), "No database tests executed"
          assert not report.findall(".//skipped"), "Database tests skipped; PostgreSQL proof is missing"
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Build production styles for native layout tests
        run: |
          npm ci --ignore-scripts
          npm run build:css
      # Includes tests/speech (fake models, no downloads). No separate repeat needed.
      - name: Full offline suite
        run: python tests/run_offline.py tests -q --tb=short --disable-warnings --basetemp=.cache/pytest-full
